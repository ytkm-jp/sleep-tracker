<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy - 究極の睡眠記録ツール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <header>
            <h1>Sleepy</h1>
            <p>良質な睡眠は、より良い明日への第一歩！</p>
        </header>

        <main>
            <section id="input-section" class="glass-card">
                <h2>今夜の記録を追加</h2>
                <form id="sleep-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="sleep-date">日付</label>
                            <input type="date" id="sleep-date" required>
                        </div>
                        <div class="form-group">
                            <label for="bed-time">就寝時間</label>
                            <input type="time" id="bed-time" required>
                        </div>
                        <div class="form-group">
                            <label for="wake-time">起床時間</label>
                            <input type="time" id="wake-time" required>
                        </div>
                        <div class="form-group">
                            <label for="wake-temp">起床時体温 (℃)</label>
                            <input type="number" id="wake-temp" step="0.1" min="30" max="45" placeholder="36.5">
                        </div>
                        <div class="form-group">
                            <label for="sleep-quality">睡眠の質 (1-5)</label>
                            <div class="quality-selector">
                                <input type="range" id="sleep-quality" min="1" max="5" step="1" value="3">
                                <div class="quality-labels">
                                    <span>😫</span>
                                    <span>😴</span>
                                    <span>🤩</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group habits-section">
                        <label>就寝前の習慣</label>
                        <div class="habits-grid">
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="☕">
                                <span class="habit-content">
                                    <span class="habit-emoji">☕</span>
                                    <span class="habit-text">カフェイン控え</span>
                                </span>
                            </label>
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="🔦">
                                <span class="habit-content">
                                    <span class="habit-emoji">🔦</span>
                                    <span class="habit-text">ライト制限</span>
                                </span>
                            </label>
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="🛁">
                                <span class="habit-content">
                                    <span class="habit-emoji">🛁</span>
                                    <span class="habit-text">入浴</span>
                                </span>
                            </label>
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="📱">
                                <span class="habit-content">
                                    <span class="habit-emoji">📱</span>
                                    <span class="habit-text">スマホ控え</span>
                                </span>
                            </label>
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="📖">
                                <span class="habit-content">
                                    <span class="habit-emoji">📖</span>
                                    <span class="habit-text">読書</span>
                                </span>
                            </label>
                            <label class="habit-item">
                                <input type="checkbox" name="habit" value="🧘‍♂️">
                                <span class="habit-content">
                                    <span class="habit-emoji">🧘‍♂️</span>
                                    <span class="habit-text">ストレッチ</span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">記録を保存する</button>
                </form>
            </section>

            <section id="history-section" class="glass-card">
                <div class="section-header">
                    <h2>睡眠の履歴</h2>
                    <button id="clear-data" class="btn-secondary">全消去</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- JavaScript will populate this -->
                    <p class="empty-msg">まだ記録がありません。今日の睡眠を記録しましょう！</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Sleepy Tracker. Designed for your better rest by ytkm.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
